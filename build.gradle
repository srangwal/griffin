plugins {
  id 'application'
  id 'idea'
  id 'eclipse'
  id 'org.springframework.boot' version '4.1.0'
  id 'com.google.protobuf' version '0.10.0'
  id 'com.github.spotbugs' version '6.5.9'
  id 'com.bmuschko.docker-remote-api' version '10.0.0'
}

group = 'srangwal'
version = '0.1.0'

java {
  sourceCompatibility = JavaVersion.VERSION_17
  targetCompatibility = JavaVersion.VERSION_17
}

tasks.withType(JavaCompile).configureEach {
  options.release = 17
}

application {
  mainClass = 'com.turn.griffin.GriffinApplication'
}

repositories {
  mavenCentral()
}

dependencies {
  testImplementation group: 'org.testng', name: 'testng', version: '7.12.0'

  implementation group: 'com.google.code.findbugs', name: 'jsr305', version: '3.0.2'
  implementation group: 'com.google.guava', name: 'guava', version: '33.6.0-jre'
  implementation group: 'org.slf4j', name: 'slf4j-log4j12', version: '1.7.6+'
  implementation group: 'org.xerial.snappy', name: 'snappy-java', version: '1.1.10.8'

  implementation group: 'commons-io', name: 'commons-io', version: '2.22.0'
  implementation group: 'commons-codec', name: 'commons-codec', version: '1.22.0'
  implementation group: 'org.apache.commons', name: 'commons-email', version: '1.6.0'
  implementation group: 'org.apache.commons', name: 'commons-lang3', version: '3.20.0'
  implementation group: 'org.apache.commons', name: 'commons-compress', version: '1.28.0'

  implementation group: 'com.google.protobuf', name: 'protobuf-java', version: '4.35.1'
  implementation group: 'org.apache.kafka', name: 'kafka-clients', version: '4.3.1'
  implementation group: 'org.springframework.boot', name: 'spring-boot-starter-webmvc', version: '4.1.0'
  implementation group: 'com.google.code.gson', name: 'gson', version: '2.14.0'
}

configurations.all {
  exclude module: 'slf4j-log4j12'
}

docker {
  url = providers.environmentVariable('DOCKER_HOST').orElse('unix:///var/run/docker.sock').get()
}

protobuf {
  protoc {
    artifact = 'com.google.protobuf:protoc:4.35.1'
  }
  generateProtoTasks {
    all().configureEach { task ->
      def grpcPlugin = task.plugins.findByName('grpc')
      if (grpcPlugin != null) {
        task.plugins.remove(grpcPlugin)
      }
    }
  }
}

jar {
  archiveBaseName = 'griffin'
}

def dockerStageDir = layout.buildDirectory.dir('docker')

tasks.register('stageDocker', Sync) {
  dependsOn bootJar
  from bootJar
  from file('src/main/docker/run')
  from file('src/main/docker/application.properties')
  from file('src/main/docker/Dockerfile')
  into dockerStageDir
}

tasks.register('buildDocker', com.bmuschko.gradle.docker.tasks.image.DockerBuildImage) {
  description = 'Build a Griffin docker image'
  dependsOn tasks.named('stageDocker')
  inputDir.set(dockerStageDir)
  dockerFile.set(dockerStageDir.map { it.file('Dockerfile') })
  images.add("${project.group}/${jar.archiveBaseName.get()}:latest")
}

javadoc {
  options.memberLevel = JavadocMemberLevel.PACKAGE
  options.noQualifiers = ['all']
}

spotbugs {
  effort = com.github.spotbugs.snom.Effort.MAX
  ignoreFailures = true
  excludeFilter = file('config/spotbugs/exclude.xml')
}

tasks.withType(com.github.spotbugs.snom.SpotBugsTask).configureEach {
  reports {
    xml.required = false
    html.required = true
  }
}

test {
  useTestNG()

  beforeTest { descriptor ->
    logger.lifecycle('Running test: ' + descriptor)
  }

  onOutput { descriptor, event ->
    logger.lifecycle('Test: ' + descriptor + ' produced standard out/err: ' + event.message)
  }
}

/* vim: set ft=groovy */
