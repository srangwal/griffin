plugins {
  id 'application'
  id 'idea'
  id 'eclipse'
  id 'org.springframework.boot' version '4.1.0'
  id 'com.google.protobuf' version '0.10.0'
  id 'com.github.spotbugs' version '6.5.9'
  id 'com.bmuschko.docker-remote-api' version '10.0.0'
}

group = 'srangwal'
version = '0.1.0'

java {
  sourceCompatibility = JavaVersion.VERSION_17
  targetCompatibility = JavaVersion.VERSION_17
}

tasks.withType(JavaCompile).configureEach {
  options.release = 17
  options.compilerArgs += ['-Xlint:deprecation']
}

application {
  mainClass = 'com.turn.griffin.GriffinApplication'
}

repositories {
  mavenCentral()
}

dependencies {
  testImplementation 'org.testng:testng:7.12.0'

  implementation 'com.google.code.findbugs:jsr305:3.0.2'
  implementation 'com.google.guava:guava:33.6.0-jre'
  implementation 'org.slf4j:slf4j-log4j12:1.7.6+'
  implementation 'org.xerial.snappy:snappy-java:1.1.10.8'

  implementation 'commons-io:commons-io:2.22.0'
  implementation 'commons-codec:commons-codec:1.22.0'
  implementation 'org.apache.commons:commons-email:1.6.0'
  implementation 'org.apache.commons:commons-lang3:3.20.0'
  implementation 'org.apache.commons:commons-compress:1.28.0'

  implementation 'com.google.protobuf:protobuf-java:4.35.1'
  implementation 'org.apache.kafka:kafka-clients:4.3.1'
  implementation 'org.springframework.boot:spring-boot-starter-webmvc:4.1.0'
  implementation 'com.google.code.gson:gson:2.14.0'
}

configurations.all {
  exclude module: 'slf4j-log4j12'
}

docker {
  url = providers.environmentVariable('DOCKER_HOST').orElse('unix:///var/run/docker.sock').get()
}

protobuf {
  protoc {
    artifact = 'com.google.protobuf:protoc:4.35.1'
  }
  generateProtoTasks {
    all().configureEach { task ->
      def grpcPlugin = task.plugins.findByName('grpc')
      if (grpcPlugin != null) {
        task.plugins.remove(grpcPlugin)
      }
    }
  }
}

jar {
  archiveBaseName = 'griffin'
}

def dockerStageDir = layout.buildDirectory.dir('docker')

tasks.register('stageDocker', Sync) {
  dependsOn bootJar
  from bootJar
  from file('src/main/docker/run')
  from file('src/main/docker/application.properties')
  from file('src/main/docker/Dockerfile')
  into dockerStageDir
}

tasks.register('buildDocker', com.bmuschko.gradle.docker.tasks.image.DockerBuildImage) {
  description = 'Build a Griffin docker image'
  dependsOn tasks.named('stageDocker')
  inputDir.set(dockerStageDir)
  dockerFile.set(dockerStageDir.map { it.file('Dockerfile') })
  images.add("${project.group}/${jar.archiveBaseName.get()}:latest")
}

javadoc {
  options.memberLevel = JavadocMemberLevel.PACKAGE
  options.noQualifiers = ['all']
}

spotbugs {
  effort = com.github.spotbugs.snom.Effort.MAX
  ignoreFailures = false
  excludeFilter = file('config/spotbugs/exclude.xml')
}

tasks.withType(com.github.spotbugs.snom.SpotBugsTask).configureEach {
  reports {
    xml.required = false
    html.required = true
  }
}

test {
  useTestNG()
}

